<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daggerheart Character Sheets</title>
  <link rel="stylesheet" href="styles.css" />
  <meta name="color-scheme" content="dark light" />
</head>
<body>
  <header class="bar">
    <div class="brand">🗡️ Daggerheart — Character Sheets</div>
    <div class="actions">
      <button id="exportJson" class="ghost" type="button">Export</button>
      <button id="importJson" class="ghost" type="button">Import</button>
      <input id="importFile" type="file" accept="application/json" hidden />
    </div>
  </header>

  <main class="wrap grid">
    <!-- Left: Create / Edit Character -->
    <section class="card" aria-labelledby="create-heading">
      <h2 id="create-heading">Create Character</h2>

      <form id="charForm" class="stack">
        <div class="split">
          <label class="stack">
            <span class="small">Name</span>
            <input name="name" placeholder="Name" autocomplete="name" required />
          </label>
          <label class="stack">
            <span class="small">Pronouns</span>
            <input name="pronouns" placeholder="they/them" />
          </label>
        </div>

        <div class="split">
          <label class="stack">
            <span class="small">Heritage</span>
            <select name="heritage" id="heritage" required></select>
          </label>
          <label class="stack">
            <span class="small">Class</span>
            <select name="klass" id="klass" required></select>
          </label>
          <label class="stack">
            <span class="small">Subclass</span>
            <select name="subclass" id="subclass"></select>
          </label>
          <label class="stack">
            <span class="small">Level</span>
            <input name="level" type="number" inputmode="numeric" min="1" value="1" />
          </label>
        </div>

        <div class="split">
          <label class="stack">
            <span class="small">HP</span>
            <input name="hp" type="number" inputmode="numeric" min="1" value="10" />
          </label>
          <label class="stack">
            <span class="small">Major Threshold</span>
            <input name="tMajor" type="number" inputmode="numeric" value="10" />
          </label>
          <label class="stack">
            <span class="small">Severe Threshold</span>
            <input name="tSevere" type="number" inputmode="numeric" value="15" />
          </label>
          <label class="stack">
            <span class="small">Armor Slots</span>
            <input name="armorSlots" type="number" inputmode="numeric" min="0" value="0" />
          </label>
        </div>

        <div class="stack">
          <span class="field-label">Attributes</span>
          <div class="row">
            <label class="stack smallgap">
              <span class="small">Agility</span>
              <input name="agility" type="number" inputmode="numeric" value="0">
            </label>
            <label class="stack smallgap">
              <span class="small">Strength</span>
              <input name="strength" type="number" inputmode="numeric" value="0">
            </label>
            <label class="stack smallgap">
              <span class="small">Finesse</span>
              <input name="finesse" type="number" inputmode="numeric" value="0">
            </label>
            <label class="stack smallgap">
              <span class="small">Instinct</span>
              <input name="instinct" type="number" inputmode="numeric" value="0">
            </label>
            <label class="stack smallgap">
              <span class="small">Presence</span>
              <input name="presence" type="number" inputmode="numeric" value="0">
            </label>
            <label class="stack smallgap">
              <span class="small">Knowledge</span>
              <input name="knowledge" type="number" inputmode="numeric" value="0">
            </label>
          </div>
        </div>

        <div class="row">
          <button class="primary" type="submit">Add Character</button>
        </div>
      </form>
    </section> <!-- ✅ CLOSED LEFT CARD -->

    <!-- Right: Characters list -->
    <section class="card" aria-labelledby="chars-heading">
      <h2 id="chars-heading">Characters</h2>
      <div id="chars" class="list" style="margin-top:12px" aria-live="polite"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
